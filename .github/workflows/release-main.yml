name: Build and release

# Triggers on every merge to main. Android is built, signed with the debug
# key (no release keystore exists yet - see android/app/build.gradle.kts)
# and pushed to Firebase App Distribution's "testers" group. iOS is only
# compiled unsigned (--no-codesign) to catch build breakage; it is not
# distributed anywhere because there is no Apple signing setup in this
# repo yet (distributing to a physical iPhone requires a paid Apple
# Developer Program membership regardless of distribution channel).
#
# Required repo secrets (see README/PR description for setup steps):
#   FIREBASE_ANDROID_APP_ID      - Firebase console > Project settings > Your apps
#   FIREBASE_SERVICE_ACCOUNT     - JSON key for a service account with the
#                                   "Firebase App Distribution Admin" role
#
# TODO once an Apple Developer account is available:
#   - iOS: run on macos-latest with Apple certificates/provisioning
#     profiles (or an App Store Connect API key) to export a signed .ipa
#     and upload it to Firebase App Distribution / TestFlight.
on:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release

      - id: pubspec
        run: |
          echo "version=$(grep '^version:' pubspec.yaml | sed 's/version: //')" >> "$GITHUB_OUTPUT"

      - uses: wzieba/Firebase-Distribution-Github-Action@v1.7.1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "v${{ steps.pubspec.outputs.version }} (build ${{ github.run_number }}) - ${{ github.sha }}"

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: "stable"
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build ios --release --no-codesign
